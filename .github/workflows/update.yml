# This workflow merges requests from Dependabot if tests are passing
# Ref: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
# Ref: https://github.com/dependabot/fetch-metadata
name: Auto-merge

on: pull_request

# Dependabot PRs' tokens have read permissions by default and thus we must enable write permissions.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      # Fetch PR metadata
      - name: Fetch PR metadata
        id: metadata
        uses: dependabot/fetch-metadata@08eff52bf64351f401fb50d4972fa95b9f2c2d1b # v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Wait for all CI checks on the PR to pass
      # Only npm updates of type minor or patch are merged automatically. `update-type` is the highest semver change
      # of the PR, also for a group of updates (whose title has no versions). Major, unknown and GitHub Actions
      # updates wait for a person.
      - name: Wait for PR CI
        if: contains(steps.metadata.outputs.package-ecosystem, 'npm') && contains(fromJSON('["version-update:semver-minor","version-update:semver-patch"]'), steps.metadata.outputs.update-type)
        uses: lewagon/wait-on-check-action@3603e826ee561ea102b58accb5ea55a1a7482343 # v1.4.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30 # seconds
          running-workflow-name: dependencies # wait for all checks except this one
          # all other checks must pass. `neutral` is allowed: CodeQL default setup does not analyze commits pushed by
          # Dependabot, so its `CodeQL` check ends as `neutral` ("configurations not found"), which is not a failure.
          # `main` is analyzed after the merge. Canceled or failed checks (also a CodeQL finding) still block it.
          allowed-conclusions: success,skipped,neutral

      # Auto-merge Dependabot PRs (same condition as above)
      # The "auto" flag will only merge once all of the target branch's required checks
      # are met. Configure those in the "branch protection" settings for each repo.
      - name: Auto-merge dependabot PRs
        if: contains(steps.metadata.outputs.package-ecosystem, 'npm') && contains(fromJSON('["version-update:semver-minor","version-update:semver-patch"]'), steps.metadata.outputs.update-type)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
