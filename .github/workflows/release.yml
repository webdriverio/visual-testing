name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select the release type"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - alpha
      package_dir:
        description: "Select the package directory (only for alpha releases)"
        required: false
        default: "packages/visual-service"
        type: choice
        options:
          - packages/ocr-service
          - packages/visual-reporter
          - packages/visual-service
          - packages/webdriver-image-comparison

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  release:
    name: ${{ github.event.inputs.release_type == 'alpha' && 'Alpha Release' || 'Production Release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: 🔧 Setup Git
        run: |
          git config --global user.email "bot@webdriver.io"
          git config --global user.name "WebdriverIO Release Bot"

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: 🧩 Install Dependencies
        run: pnpm install --frozen-lockfile

      # ========================================
      # Alpha Release Steps
      # ========================================
      - name: 🚫 Block Alpha in Changesets Pre Mode
        if: github.event.inputs.release_type == 'alpha'
        run: |
          if [[ -f .changeset/pre.json ]]; then
            echo "Changesets pre mode is active: use the production release type, it publishes prerelease versions."
            exit 1
          fi

      - name: 🔄 Validate Package Directory
        if: github.event.inputs.release_type == 'alpha'
        run: |
          if [[ ! "${{ github.event.inputs.package_dir }}" =~ ^packages/[a-zA-Z0-9_-]+$ ]]; then
            echo "Invalid package directory: ${{ github.event.inputs.package_dir }}"
            exit 1
          fi
          if [[ ! -d "${{ github.event.inputs.package_dir }}" ]]; then
            echo "Package directory does not exist: ${{ github.event.inputs.package_dir }}"
            exit 1
          fi

      - name: 🏗️ Build the Package (Alpha)
        if: github.event.inputs.release_type == 'alpha'
        run: |
          cd ${{ github.event.inputs.package_dir }}
          pnpm build

      - name: 🔢 Bump Version for Alpha Release
        if: github.event.inputs.release_type == 'alpha'
        run: |
          cd ${{ github.event.inputs.package_dir }}
          npm version prerelease --preid=alpha

      - name: 📦 Commit and Push Version Changes (Alpha)
        if: github.event.inputs.release_type == 'alpha'
        working-directory: ${{ github.event.inputs.package_dir }}
        run: |
          git add package.json
          git commit -m "chore: bump version for alpha release [skip ci]"
          git push origin HEAD

      - name: 🚀 Publish to npm with Alpha Tag
        if: github.event.inputs.release_type == 'alpha'
        run: |
          cd ${{ github.event.inputs.package_dir }}
          npm publish --tag alpha

      - name: 📦 Push Tags to GitHub (Alpha)
        if: github.event.inputs.release_type == 'alpha'
        run: |
          cd ${{ github.event.inputs.package_dir }}
          git push --follow-tags

      # ========================================
      # Production Release Steps
      # ========================================
      - name: 🏗️ Build (Production)
        if: github.event.inputs.release_type == 'production'
        id: build-the-mono-repo
        run: |
          pnpm build

      - name: 📣 Create Release Pull Request or Publish to npm
        if: github.event.inputs.release_type == 'production'
        id: changesets
        # changesets/action v2 is for Changesets CLI v3. The git identity set above is kept, and the release commit and
        # tags are pushed with the GitHub API. The `github-token` input defaults to `github.token`; v2 refuses a
        # different GITHUB_TOKEN environment variable, so do not set one in this workflow.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish-script: pnpm release
          commit-message: "chore: release [skip ci]"
