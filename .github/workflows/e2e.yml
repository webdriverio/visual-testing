name: e2e

# Jobs that need the cloud credentials (LambdaTest, Sauce Labs): pull requests only
on:
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read
  pull-requests: read

# One run per pull request: a new commit cancels the run of the previous commit
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.9+sha256.cf86a7ad764406395d4286a6d09d730711720acc6d93e9dce9ac7ac4dc4a28a7

jobs:
  ci-pr-desktop-web:
    name: 🔄 💻 CI PR Run Desktop Web Tests on LambdaTest
    runs-on: ubuntu-latest
    # Needs the cloud credentials, which GitHub does not give to pull requests from forks.
    # For Dependabot, run only when the update can change the desktop e2e results.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository && (
        github.actor != 'dependabot[bot]' ||
        contains(github.event.pull_request.title, 'copyfiles') ||
        contains(github.event.pull_request.title, 'rimraf') ||
        contains(github.event.pull_request.title, 'saucelabs') ||
        contains(github.event.pull_request.title, 'lambdatest') ||
        contains(github.event.pull_request.title, 'webdriverio') ||
        (contains(github.event.pull_request.title, '@wdio/') && !contains(github.event.pull_request.title, '@wdio/appium-service'))
      )
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 🧩 Install Dependencies
        run: pnpm pnpm.install.workaround

      - name: 🏗️ Build
        working-directory: ./
        run: pnpm build

      - name: 🖥️ 🌐 Run Desktop Web e2e tests
        working-directory: ./
        env:
          LAMBDATEST_USERNAME: ${{ secrets.LAMBDATEST_USERNAME }}
          LAMBDATEST_ACCESS_KEY: ${{ secrets.LAMBDATEST_ACCESS_KEY }}
          BUILD_PREFIX: true
        run: pnpm test.lambdatest.desktop --maxConcurrency=3

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: ci-pr-desktop-web-logs
          include-hidden-files: true
          path: |
            logs/*.log
            .tmp/
            !.tmp/checkActual/
            !.tmp/saveActual/
            !.tmp/testDiff/
            !.next/

  ci-pr-android-web:
    name: 🔄 🤖 🌐 CI PR Run Android Web Tests on LambdaTest
