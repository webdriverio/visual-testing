  ci-pr-app:
    name: 🔄 📱 CI PR Run Mobile App Tests on Sauce
    runs-on: ubuntu-latest
    # Usually 5-17 minutes; failing checks with retries can take 30+. Without a limit, a hung job runs until the GitHub default of 6 hours
    timeout-minutes: 45
    # Needs the cloud credentials, which GitHub does not give to pull requests from forks or from Dependabot
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: ⬇️ Checkout Repository
