name: ios simulator

# The iOS mobile web e2e tests on a simulator in the GitHub macOS runner. No cloud credentials are needed, so this
# also runs for pull requests from forks. It runs only when a change can affect the mobile screenshots.
# The LambdaTest iOS jobs (e2e workflow) stay: they test cloud devices with committed baselines.
on:
  pull_request:
    paths:
      # Dependency updates (for example webdriverio, @wdio/*, Appium-related packages) can change the screenshots
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "packages/image-comparison-core/package.json"
      - "packages/visual-service/package.json"
      - "packages/image-comparison-core/src/**"
      - "packages/visual-service/src/**"
      - "tests/specs/mobile.web.spec.ts"
      - "tests/configs/wdio.shared.conf.ts"
      - "tests/configs/wdio.local.appium.shared.conf.ts"
      - "tests/configs/wdio.local.ios.sims.web.conf.ts"
      - ".github/scripts/ios-simulator-e2e.sh"
      - ".github/workflows/ios-simulator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  ios-simulator-web:
    name: 🍏 Run the iOS mobile web e2e tests on a simulator
    runs-on: macos-26
    # Without a limit, a hung job runs until the GitHub default of 6 hours
    timeout-minutes: 60
    env:
      # A new simulator of this type is created with the newest iOS runtime of the default Xcode
      SIMULATOR_DEVICE_TYPE: iPhone 17 Pro
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 🧩 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build
        run: pnpm build

      - name: 📱 Install Appium and the XCUITest driver
        run: |
          npm install --global appium@3.8.0
          appium driver install xcuitest@12.16.0

      - name: 🍏 Run the e2e tests on the iOS simulator
        run: bash .github/scripts/ios-simulator-e2e.sh

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: ios-simulator-logs
          include-hidden-files: true
          path: |
            logs/
            .tmp/
            tests/localBaseline/
