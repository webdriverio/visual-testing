version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # no cooldown: the Dependabot default (3 days) is longer than pnpm's `minimumReleaseAge` (1 day)
  groups:
    # react-dom throws when its version is not the same as react
    react:
      patterns:
        - "react"
        - "react-dom"
  ignore:
    # TypeScript 7 is a new major version: update it by hand, in its own PR
    - dependency-name: "typescript"
      update-types: ["version-update:semver-major"]
    # @types/node follows the Node.js version of .nvmrc (24), not the newest Node.js
    - dependency-name: "@types/node"
      update-types: ["version-update:semver-major"]
