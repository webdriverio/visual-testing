<!doctype html>
<html>
<head><meta charset="utf-8"><title>Delayed change</title>
<style>
    body { margin: 0; background: #fff; }
    #box { margin: 20px; width: 200px; height: 100px; background: #388e3c; }
    #box.done { background: #1565c0; }
</style>
</head>
<body>
<div id="box"></div>
<script>
    // The test changes the box after a delay, for example like an animation: `setBox(done, delay, replace)`.
    // With `replace`, a new box element replaces the old one, like a framework that renders the element again.
    window.setBox = (done, delay = 0, replace = false) => setTimeout(() => {
        const old = document.getElementById('box')
        const box = replace ? document.createElement('div') : old
        box.id = 'box'
        box.classList.toggle('done', done)
        if (replace) {
            old.replaceWith(box)
        }
    }, delay)
</script>
</body>
</html>
