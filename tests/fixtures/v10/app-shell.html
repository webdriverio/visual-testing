<!doctype html>
<html>
<head><meta charset="utf-8"><title>App shell</title>
<style>
    /* The page itself does not scroll, the main container does (#125) */
    html, body { height: 100%; margin: 0; overflow: hidden; background: #fff; }
    body { display: flex; flex-direction: column; }
    header, footer { height: 60px; flex: none; background: #263238; }
    main { flex: 1; overflow: auto; }
    .row { height: 300px; border-bottom: 4px solid #000; }
    /* `?sticky`: a sticky title at the top of the container, so it is in each screenshot of the container */
    #title { position: sticky; top: 0; height: 40px; background: #ef6c00; }
    /* `?expanded`: the container has no scroll, so the page scrolls: the expected full page image */
    html.expanded, html.expanded body { height: auto; overflow: visible; }
    html.expanded main { flex: none; overflow: visible; }
</style>
<script>
    if (location.search.includes('expanded')) {
        document.documentElement.classList.add('expanded')
    }
    if (location.search.includes('sticky')) {
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('scroller').insertAdjacentHTML('afterbegin', '<div id="title"></div>')
        })
    }
</script>
</head>
<body>
<header></header>
<main id="scroller">
    <div class="row" style="background: #388e3c"></div>
    <div class="row" style="background: #1565c0"></div>
    <div class="row" style="background: #f9a825"></div>
    <div class="row" style="background: #6a1b9a"></div>
    <div class="row" style="background: #c62828"></div>
    <div class="row" style="background: #00838f"></div>
</main>
<footer></footer>
</body>
</html>
