packages:
  - packages/*

patchedDependencies:
  wdio-lambdatest-service@4.0.1: patches/wdio-lambdatest-service@4.0.1.patch

# edgedriver/geckodriver: WebdriverIO downloads the drivers at runtime.
# Others only print messages or run version checks.
allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false
  protobufjs: false
  tesseract.js: false
  unrs-resolver: false

# pnpm refuses packages that are less than 1 day old. expect-webdriverio 8.0.0 was published on 2026-10-10 at
# 16:09 UTC: remove this exception after 2026-10-11 16:10 UTC
minimumReleaseAgeExclude:
  - expect-webdriverio@8.0.0
