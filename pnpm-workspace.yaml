packages:
  - packages/*

patchedDependencies:
  wdio-lambdatest-service@4.0.1: patches/wdio-lambdatest-service@4.0.1.patch

# edgedriver/geckodriver: WebdriverIO downloads the drivers at runtime.
# Others only print messages or run version checks.
allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false
  protobufjs: false
  tesseract.js: false
  unrs-resolver: false

# pnpm refuses packages that are less than 1 day old. WebdriverIO 10.1.0 was published on 2026-10-18 at
# 21:18 UTC: remove this exception after 2026-10-19 21:20 UTC
minimumReleaseAgeExclude:
  - '@wdio/appium-service@10.1.0'
  - '@wdio/cli@10.1.0'
  - '@wdio/config@10.1.0'
  - '@wdio/display-server@10.1.0'
  - '@wdio/dot-reporter@10.1.0'
  - '@wdio/globals@10.1.0'
  - '@wdio/jasmine-framework@10.1.0'
  - '@wdio/local-runner@10.1.0'
  - '@wdio/logger@10.1.0'
  - '@wdio/mocha-framework@10.1.0'
  - '@wdio/reporter@10.1.0'
  - '@wdio/runner@10.1.0'
  - '@wdio/sauce-service@10.1.0'
  - '@wdio/session@10.1.0'
  - '@wdio/shared-store-service@10.1.0'
  - '@wdio/snapshot@10.1.0'
  - '@wdio/spec-reporter@10.1.0'
  - '@wdio/types@10.1.0'
  - '@wdio/utils@10.1.0'
  - create-wdio@10.1.0
  - webdriver@10.1.0
  - webdriverio@10.1.0
